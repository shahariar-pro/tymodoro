<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer timer track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="24" />
  
  <!-- Active timer arc (~75% progress) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="1131" stroke-dashoffset="282"
          transform="rotate(-90 256 256)" filter="url(#glow)" />
  
  <!-- Center Core Dial -->
  <circle cx="256" cy="256" r="88" fill="#18181b" stroke="#3f3f46" stroke-width="8" />
  
  <!-- Focus center pip -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" />
  
  <!-- Top 12 o'clock indicator -->
  <circle cx="256" cy="76" r="8" fill="#ffffff" opacity="0.9" />
</svg>
