<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYMODORO Timer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23000' stroke='%23fff' stroke-width='3'/><circle cx='50' cy='50' r='20' fill='%23fff'/></svg>" type="image/svg+xml">
    <script src="vendor/lucide.min.js"></script>
    <style>
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 300 800;
            font-display: swap;
            src: url('fonts/outfit-latin.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Plus Jakarta Sans';
            font-style: normal;
            font-weight: 300 800;
            font-display: swap;
            src: url('fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 300 800;
            font-display: swap;
            src: url('fonts/inter-latin.woff2') format('woff2');
        }
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url('fonts/jetbrains-mono-latin.woff2') format('woff2');
        }

        :root,
        [data-font="outfit"],
        [data-font="modern"],
        [data-font="rounded"],
        body:not([data-font]) {
            --font-main: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        [data-font="jakarta"],
        [data-font="editorial"] {
            --font-main: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        [data-font="inter"] {
            --font-main: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        [data-font="mono"] {
            --font-main: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        }
        [data-font="system"] {
            --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        *, *::before, *::after, html, body, button, input {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main) !important;
        }

        /* Define CSS variables for theming */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #111111;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent: #ffffff;
            --border: #333333;
            --danger: #ef4444;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            padding: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .session-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            /* Ensure text wraps nicely */
            word-break: break-word;
            padding: 0 1rem;
        }

        .timer-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .timer-btn {
            width: 60px;
            height: 60px;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .timer-btn:hover {
            transform: scale(1.1);
            background: var(--accent);
            color: var(--bg-primary);
        }

        .timer-btn:active {
            transform: scale(0.95);
        }

        .timer-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }
        
        /* Style for the skip button */
        .timer-btn.skip-btn {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        .timer-btn.skip-btn:hover {
            background: #dc2626; /* Darker red on hover */
            color: white;
        }

        .info-text {
            font-size: 0.875rem;
            color: #888888;
            margin-top: 1rem;
            position: absolute;
            bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="timer-widget">
        <div class="session-label" id="sessionLabel">Deep Focus Session</div>
        <div class="timer-display" id="timerDisplay">25:00</div>
        
        <div class="timer-controls">
            <button class="timer-btn" id="playBtn" title="Play/Pause" aria-label="Start or pause timer">
                <span id="playIconContainer">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                </span>
            </button>
            <button class="timer-btn skip-btn" id="skipBtn" title="Skip session" aria-label="Skip session">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg>
            </button>
        </div>
        
        <div class="info-text">
            Synced with main window
        </div>
    </div>

    <script>
        // Store theme settings
        const themes = {
            dark: {
                '--bg-primary': '#000000',
                '--bg-secondary': '#111111',
                '--text-primary': '#ffffff',
                '--text-secondary': '#cccccc',
                '--accent': '#ffffff',
                '--border': '#333333',
                '--danger': '#ef4444'
            },
            light: {
                '--bg-primary': '#ffffff',
                '--bg-secondary': '#f8f9fa',
                '--text-primary': '#000000',
                '--text-secondary': '#374151',
                '--accent': '#000000',
                '--border': '#e5e7eb',
                '--danger': '#dc2626'
            },
            ocean: {
                '--bg-primary': '#0f172a',
                '--bg-secondary': '#1e293b',
                '--text-primary': '#f1f5f9',
                '--text-secondary': '#cbd5e1',
                '--accent': '#0ea5e9',
                '--border': '#475569',
                '--danger': '#ef4444'
            },
            forest: {
                '--bg-primary': '#0f1419',
                '--bg-secondary': '#1a2332',
                '--text-primary': '#f7fafc',
                '--text-secondary': '#e2e8f0',
                '--accent': '#48bb78',
                '--border': '#4a5568',
                '--danger': '#e53e3e'
            },
            sunset: {
                '--bg-primary': '#1a1625',
                '--bg-secondary': '#2d1b3d',
                '--text-primary': '#faf5ff',
                '--text-secondary': '#e9d5ff',
                '--accent': '#f59e0b',
                '--border': '#553c9a',
                '--danger': '#f56565'
            },
            purple: {
                '--bg-primary': '#1e1b4b',
                '--bg-secondary': '#312e81',
                '--text-primary': '#f8fafc',
                '--text-secondary': '#e2e8f0',
                '--accent': '#a855f7',
                '--border': '#4c1d95',
                '--danger': '#ef4444'
            },
            rose: {
                '--bg-primary': '#1f0f1a',
                '--bg-secondary': '#3a1f2e',
                '--text-primary': '#fce7f3',
                '--text-secondary': '#fbcfe8',
                '--accent': '#ec4899',
                '--border': '#be185d',
                '--danger': '#f43f5e'
            },
            blush: {
                '--bg-primary': '#faf8f7',
                '--bg-secondary': '#f5f3f1',
                '--text-primary': '#3f2f28',
                '--text-secondary': '#6b5b52',
                '--accent': '#f8a8d8',
                '--border': '#e8d8d1',
                '--danger': '#dc2626'
            }
        };

        function updateDisplay(timeLeft) {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const displayText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById("timerDisplay").textContent = displayText;
            document.title = `${displayText} - TYMODORO`;
        }

        const FLOAT_SVG_PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>';
        const FLOAT_SVG_PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="4" height="16" x="6" y="4"></rect><rect width="4" height="16" x="14" y="4"></rect></svg>';

        function updateButtonState(isRunning) {
            const container = document.getElementById('playIconContainer');
            if (container) {
                container.innerHTML = isRunning ? FLOAT_SVG_PAUSE : FLOAT_SVG_PLAY;
            }
            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
                playBtn.setAttribute('aria-label', isRunning ? 'Pause timer' : 'Start timer');
            }
        }
        
        function applyTheme(themeName) {
            const theme = themes[themeName] || themes.dark;
            const root = document.documentElement;
            for (const [key, value] of Object.entries(theme)) {
                root.style.setProperty(key, value);
            }
        }

        // Send action to main window
        function postAction(actionType) {
            if (window.opener) {
                window.opener.postMessage({ type: actionType }, window.location.origin);
            } else {
                console.error("Cannot communicate with main window. 'window.opener' is null.");
            }
        }

        // Listen for messages from main window
        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;
            if (event.source !== window.opener) return;
            
            const data = event.data;
            if (!data) return;
            
            if (data.type === 'updateTimer') {
                updateDisplay(data.timeLeft);
                updateButtonState(data.isRunning);
                
                // Update session label
                const sessionLabels = {
                    work: 'Deep Focus Session',
                    shortBreak: 'Quick Recharge',
                    longBreak: 'Extended Break'
                };
                
                // Use the task text if provided, otherwise default
                let labelText = data.currentTaskText || sessionLabels[data.currentSession] || 'Deep Focus Session';
                document.getElementById('sessionLabel').textContent = labelText;
                
                // Apply the theme
                applyTheme(data.currentTheme);
            }
        });

        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const playBtn = document.getElementById('playBtn');
            const skipBtn = document.getElementById('skipBtn');
            if (playBtn) playBtn.addEventListener('click', () => postAction('toggleTimer'));
            if (skipBtn) skipBtn.addEventListener('click', () => postAction('skipSession'));

            // Request initial state from main window
            if (window.opener) {
                window.opener.postMessage({ type: 'requestSync' }, window.location.origin);
            } else {
                document.getElementById('sessionLabel').textContent = "Error: Not connected";
                document.getElementById('info-text').textContent = "Please open from the main app.";
            }
        });

        // Notify main window when this window is closed
        window.addEventListener('beforeunload', () => {
            if (window.opener) {
                window.opener.postMessage({ type: 'floatWindowClosed' }, window.location.origin);
            }
        });
    </script>
</body>
</html>
